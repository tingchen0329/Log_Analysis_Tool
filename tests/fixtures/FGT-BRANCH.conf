#config-version=FG60F-7.0.15-FW-build0632-240416:opmode=0:vdom=0:user=admin
#conf_file_ver=24157862359230437
#buildno=0632
#global_vdom=1
config system global
    set alias "FortiGate-60F"
    set hostname "FGT-BRANCH"
    set timezone 54
end
config system interface
    edit "wan1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh fgfm
        set type hard-switch
        config ipv6
            set ip6-address ::/0
        end
    next
end
